# Frontend — NodePort 30080
# http://<NODE_IP>:30080/  (nginx proxies /springboot38hdw40x/ → Service warehouse-app)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse-frontend
  namespace: warehouse
  labels:
    app: warehouse-frontend
    tier: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: warehouse-frontend
  template:
    metadata:
      labels:
        app: warehouse-frontend
        tier: frontend
    spec:
      terminationGracePeriodSeconds: 20
      imagePullSecrets:
        - name: harbor-cred
      containers:
        - name: frontend
          # CD: 121.40.253.17/warehouse/warehouse-frontend:build.<N>
          image: 121.40.253.17/warehouse/warehouse-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse-frontend
  namespace: warehouse
  labels:
    app: warehouse-frontend
spec:
  selector:
    app: warehouse-frontend
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
