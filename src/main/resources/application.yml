# Tomcat
server:
    tomcat:
        uri-encoding: UTF-8
    port: 8080
    servlet:
        context-path: /springboot38hdw40x


spring:
    datasource:
        driverClassName: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://127.0.0.1:3306/springboot38hdw40x?useUnicode=true&characterEncoding=utf-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
        username: ${SPRING_DATASOURCE_USERNAME:root}
        password: ${SPRING_DATASOURCE_PASSWORD:}

#        driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
#        url: jdbc:sqlserver://127.0.0.1:1433;DatabaseName=springboot38hdw40x
#        username: sa
#        password: ${SPRING_DATASOURCE_PASSWORD:}

    servlet:
      multipart:
        max-file-size: 300MB
        max-request-size: 300MB
    resources:
      static-locations: classpath:static/,file:static/

# AI 智能分析助手（OpenAI 兼容接口）
ai:
  enabled: true
  provider: openai-compatible
  base-url: https://ai.imge.cc.cd/v1
  api-key: ${AI_API_KEY:}
  model: qwen/qwen3.5-35b-a3b
  # 思考模型需要更大输出额度；超时后自动本地统计降级
  timeout-ms: 90000
  max-tokens: 4096
  top-n: 20
  replenish:
    default-lead-days: 14
  cache:
    ttl-minutes: 30
    max-size: 500

#mybatis
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.entity,com.ai.entity
  global-config:
    db-config:
      # ASSIGN_ID / AUTO / INPUT — keep INPUT to match previous id-type: 1
      id-type: INPUT
      # NOT_NULL matches previous field-strategy: 1
      insert-strategy: NOT_NULL
      update-strategy: NOT_NULL
      where-strategy: NOT_NULL
      logic-delete-value: -1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    #springboot 项目mybatis plus 设置 jdbcTypeForNull (oracle数据库需配置JdbcType.NULL, 默认是Other)
    jdbc-type-for-null: 'null'
