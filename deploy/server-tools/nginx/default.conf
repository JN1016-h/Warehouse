server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  autoindex on;
  charset utf-8;

  location / {
    return 302 /reports/;
  }

  location /reports/ {
    alias /usr/share/nginx/html/reports/;
    autoindex on;
    add_header Cache-Control "no-store";
  }

  location /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
