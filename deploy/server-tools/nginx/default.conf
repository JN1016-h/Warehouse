server {
  listen 80;
  server_name _;
  charset utf-8;

  location = / {
    return 302 /reports/;
  }

  # Host dir /opt/ci-reports → container /usr/share/nginx/html/reports
  location /reports/ {
    alias /usr/share/nginx/html/reports/;
    index index.html;
    autoindex on;
    add_header Cache-Control "no-store";
  }

  location /healthz {
    default_type text/plain;
    return 200 'ok';
  }
}
