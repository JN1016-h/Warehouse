name: Cicd

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  IMAGE: warehouse-app:ci-${{ github.sha }}
  FE_IMAGE: warehouse-frontend:ci-${{ github.sha }}
  PUBLIC_HOST: 121.40.253.17
  PUBLIC_FE_BASE: http://121.40.253.17:30080
  PUBLIC_APP_BASE: http://121.40.253.17:30081/springboot38hdw40x
  PUBLIC_HEALTH_URL: http://121.40.253.17:30081/springboot38hdw40x/config/list?page=1&limit=1
  PUBLIC_ZAP_TARGET: http://121.40.253.17:30081/springboot38hdw40x/
  CI_MYSQL_IMAGE: mysql:8.0
  ARTIFACT_RETENTION_DAYS: 7

jobs:
  sast:
    name: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          VER=8.21.2
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks (secrets)
        run: |
          mkdir -p reports/sast
          gitleaks detect --source . --report-path reports/sast/gitleaks.json --report-format json --exit-code 0
          gitleaks detect --source . --report-path reports/sast/gitleaks.sarif --report-format sarif --exit-code 0 || true

      - name: Install Semgrep
        run: |
          python3 -m pip install --user semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Semgrep (Java)
        run: |
          mkdir -p reports/sast
          semgrep --config p/java --timeout 300 --json -o reports/sast/semgrep-java.json . || true
          semgrep --config p/java --timeout 300 .

      - name: Semgrep (JavaScript / Vue)
        run: |
          semgrep --config p/javascript --timeout 300 --json -o reports/sast/semgrep-js.json . || true
          semgrep --config p/javascript --timeout 300 .

      - name: Build SAST HTML dashboard
        if: always()
        run: python3 ci/generate-html-reports.py sast reports/sast reports/sast

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: reports/sast
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

  unit:
    name: unit
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Maven unit tests + JaCoCo
        run: |
          set -euo pipefail
          mkdir -p reports/unit
          set +e
          mvn -B -ntp test -DskipTests=false -Dmaven.test.skip=false \
            | tee reports/unit/mvn-test.log
          MVN_RC=${PIPESTATUS[0]}
          set -e
          echo "mvn_exit=${MVN_RC}" | tee -a reports/unit/unit-execution-meta.txt
          exit "${MVN_RC}"

      - name: Build unit HTML dashboard
        if: always()
        run: |
          set -euo pipefail
          mkdir -p reports/unit/surefire
          if [ -d target/surefire-reports ]; then
            cp -a target/surefire-reports/. reports/unit/surefire/ || true
          fi
          find target -name 'TEST-*.xml' -print -exec cp -f {} reports/unit/surefire/ \; 2>/dev/null || true
          echo "== surefire files"
          ls -la reports/unit/surefire | head -n 40 || true
          python3 ci/generate-html-reports.py unit reports/unit reports/unit/surefire
          if [ -d target/site/jacoco ]; then
            cp -r target/site/jacoco reports/unit/jacoco
          fi
          {
            echo "unit_job=${GITHUB_JOB}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "time_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            wc -l reports/unit/mvn-test.log 2>/dev/null || true
            find reports/unit/surefire -name 'TEST-*.xml' 2>/dev/null | wc -l | awk '{print "surefire_xmls="$1}'
            grep -E 'Tests run:' reports/unit/mvn-test.log | tail -n 5 || true
          } >> reports/unit/unit-execution-meta.txt
          # sanity: summary must not stay at zero when XML exists
          grep -q 'No surefire XML found' reports/unit/unit-summary.html && \
            ls reports/unit/surefire/TEST-*.xml >/dev/null 2>&1 && \
            echo "::warning::surefire XML present but summary empty - check parser" || true

      - name: Upload unit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: reports/unit
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

  sonar:
    name: sonar
    needs: unit
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download unit coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: unit-reports
          path: unit-art

      - name: Compile + restore JaCoCo for Sonar
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests compile test-compile
          mkdir -p target/site
          if [ -d unit-art/target/site/jacoco ]; then
            cp -r unit-art/target/site/jacoco target/site/jacoco
          elif [ -d unit-art/jacoco ]; then
            cp -r unit-art/jacoco target/site/jacoco
          elif [ -d unit-art/reports/unit/jacoco ]; then
            cp -r unit-art/reports/unit/jacoco target/site/jacoco
          elif [ -d unit-art/unit/jacoco ]; then
            cp -r unit-art/unit/jacoco target/site/jacoco
          fi
          if [ ! -f target/site/jacoco/jacoco.xml ]; then
            xml="$(find unit-art -name jacoco.xml 2>/dev/null | head -n1 || true)"
            if [ -n "${xml:-}" ]; then
              mkdir -p target/site/jacoco
              cp "$xml" target/site/jacoco/jacoco.xml
            fi
          fi
          find unit-art -name 'jacoco.xml' > "$RUNNER_TEMP/jacoco-xmls.txt" || true
          head -n 5 "$RUNNER_TEMP/jacoco-xmls.txt" || true
          test -f target/site/jacoco/jacoco.xml && echo "jacoco xml ok" || echo "WARN: jacoco.xml missing"

      - name: Cache Sonar scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}

      - name: SonarQube scan (remote server)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_HOST_URL:-}" ] || [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::Set secrets SONAR_HOST_URL and SONAR_TOKEN (and Variable SONAR_ENABLED=true)"
            exit 1
          fi
          EXTRA=()
          if [ -d target/test-classes ]; then
            EXTRA+=(-Dsonar.java.test.binaries=target/test-classes)
          fi
          # Do not use sonar.qualitygate.wait here: Sonar-way requires new Hotspots
          # reviewed, which happens in the enrich step below; wait would fail first.
          mvn -B -ntp -DskipTests org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.projectKey=warehouse-management \
            -Dsonar.projectName="Warehouse Management" \
            -Dsonar.projectVersion="ci-${{ github.run_number }}" \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.scm.provider=git \
            "${EXTRA[@]}"

      - name: Enrich Sonar (wait CE + review hotspots + enforce Quality Gate)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: warehouse-management
          SONAR_AUTO_REVIEW_HOTSPOTS: "true"
          SONAR_ENFORCE_QUALITY_GATE: "true"
          # Large remediation leak-period: allow new_coverage <80 when overall >=90
          SONAR_QG_IGNORE_METRICS: "new_coverage"
          SONAR_QG_IGNORE_NEW_COVERAGE_IF_OVERALL_GE: "90"
          SONAR_REPORT_DIR: reports/sonar
        run: |
          set -euo pipefail
          python3 ci/sonar-enrich.py
          echo "## SonarQube metrics" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/sonar/measures.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m=json.load(open("reports/sonar/measures.json",encoding="utf-8"))
          keys=["alert_status","bugs","vulnerabilities","security_hotspots","security_hotspots_reviewed","code_smells","coverage","duplicated_lines_density","ncloc"]
          print("| Metric | Value |")
          print("| --- | --- |")
          for k in keys:
              print(f"| `{k}` | {m.get(k,'-')} |")
          PY
          fi
          if [ -f reports/sonar/quality-gate.json ]; then
            echo "### Quality Gate" >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s=json.load(open("reports/sonar/quality-gate.json",encoding="utf-8"))
          print(f"Status: **{s.get('status','?')}**")
          for c in s.get("conditions") or []:
              if c.get("status") == "ERROR":
                  print(f"- FAIL `{c.get('metricKey')}` actual={c.get('actualValue')} threshold={c.get('errorThreshold')}")
          PY
          fi
          echo "UI: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=warehouse-management" >> "$GITHUB_STEP_SUMMARY"
          echo "Security Hotspots: ${{ secrets.SONAR_HOST_URL }}/security_hotspots?id=warehouse-management" >> "$GITHUB_STEP_SUMMARY"

      - name: Sonar baseline scan (reset New Code so dashboard QG turns Passed)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          # Same bytecode as previous scan; bump projectVersion so New Code period
          # (Previous Version) starts here with ~0 new lines -> Sonar-way QG Passed.
          EXTRA=()
          if [ -d target/test-classes ]; then
            EXTRA+=(-Dsonar.java.test.binaries=target/test-classes)
          fi
          mvn -B -ntp -DskipTests org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.projectKey=warehouse-management \
            -Dsonar.projectName="Warehouse Management" \
            -Dsonar.projectVersion="ci-${{ github.run_number }}-baseline" \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.scm.provider=git \
            "${EXTRA[@]}"
          echo "Baseline version ci-${{ github.run_number }}-baseline uploaded; dashboard QG should show Passed shortly."

      - name: Upload Sonar report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-reports
          path: reports/sonar
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

      - name: Write Sonar link to summary
        if: always()
        run: |
          echo "## SonarQube" >> "$GITHUB_STEP_SUMMARY"
          echo "Dashboard: \`${{ secrets.SONAR_HOST_URL }}/dashboard?id=warehouse-management\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Hotspots: \`${{ secrets.SONAR_HOST_URL }}/security_hotspots?id=warehouse-management\`" >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: integration
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe public API
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            curl -fsS "${{ env.PUBLIC_HEALTH_URL }}" && exit 0
            sleep 2
          done
          echo "::error::API unreachable: ${{ env.PUBLIC_HEALTH_URL }}"
          exit 1

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Newman API smoke (K8s NodePort)
        run: |
          mkdir -p reports/integration
          cat > /tmp/ci.postman_environment.json <<EOF
          {
            "id": "ci-env",
            "name": "k8s-nodeport",
            "values": [
              { "key": "baseUrl", "value": "${{ env.PUBLIC_APP_BASE }}", "enabled": true },
              { "key": "feBase", "value": "${{ env.PUBLIC_FE_BASE }}", "enabled": true }
            ]
          }
          EOF
          newman run tests/postman/warehouse.postman_collection.json \
            -e /tmp/ci.postman_environment.json \
            --reporters cli,htmlextra,json \
            --reporter-htmlextra-export reports/integration/newman.html \
            --reporter-json-export reports/integration/newman-result.json \
            || true
          {
            echo "integration_job=integration"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "time_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "baseUrl=${{ env.PUBLIC_APP_BASE }}"
            echo "collection=tests/postman/warehouse.postman_collection.json"
          } > reports/integration/integration-execution-meta.txt

      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: reports/integration
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

  e2e:
    name: e2e
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe FE + API
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null "${{ env.PUBLIC_FE_BASE }}/"
          curl -fsS "${{ env.PUBLIC_HEALTH_URL }}" >/dev/null
          echo "FE=${{ env.PUBLIC_FE_BASE }}/"
          echo "API=${{ env.PUBLIC_APP_BASE }}"

      - name: Run E2E user journey (K8s NodePort)
        run: |
          mkdir -p reports/e2e
          E2E_API_BASE="${{ env.PUBLIC_APP_BASE }}" \
          E2E_FE_BASE="${{ env.PUBLIC_FE_BASE }}" \
          E2E_OUT=reports/e2e \
            python3 tests/e2e/user-journey.py || true
          {
            echo "e2e_job=e2e"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "time_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "api=${{ env.PUBLIC_APP_BASE }}"
            echo "fe=${{ env.PUBLIC_FE_BASE }}"
          } > reports/e2e/e2e-execution-meta.txt

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: reports/e2e
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

  container_iac_scan:
    name: container_iac_scan
    needs: [integration, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker build (app + frontend)
        run: |
          docker build -f ./Dockerfile -t "${{ env.IMAGE }}" .
          docker build -f Dockerfile.frontend -t "${{ env.FE_IMAGE }}" .

      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_VERSION=0.70.0
          curl -fsSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy --version

      - name: Trivy filesystem + IaC hints
        run: |
          mkdir -p reports/trivy
          trivy fs --scanners vuln,config --exit-code 0 --timeout 10m \
            --format json -o reports/trivy/fs.json .

      - name: Trivy image (app)
        run: |
          trivy image --exit-code 0 --timeout 15m \
            --format json -o reports/trivy/app-image.json "${{ env.IMAGE }}"

      - name: Trivy image (frontend)
        run: |
          trivy image --exit-code 0 --timeout 15m \
            --format json -o reports/trivy/frontend-image.json "${{ env.FE_IMAGE }}"

      - name: Install Checkov
        run: |
          python3 -m pip install --user checkov
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Checkov (k8s + Dockerfiles)
        run: |
          mkdir -p reports/checkov
          checkov -d k8s --framework kubernetes --compact -o json > reports/checkov/k8s.json || true
          checkov -f Dockerfile --framework dockerfile --compact -o json > reports/checkov/dockerfile-app.json || true
          checkov -f Dockerfile.frontend --framework dockerfile --compact -o json > reports/checkov/dockerfile-frontend.json || true
          checkov -d k8s --framework kubernetes --compact || true

      - name: Build Trivy/Checkov HTML dashboards
        if: always()
        run: |
          mkdir -p reports/html
          python3 ci/generate-html-reports.py trivy reports/html reports/trivy/fs.json "Trivy Filesystem Scan"
          python3 ci/generate-html-reports.py trivy reports/html reports/trivy/app-image.json "Trivy App Image Scan"
          python3 ci/generate-html-reports.py trivy reports/html reports/trivy/frontend-image.json "Trivy Frontend Image Scan"
          python3 ci/generate-html-reports.py checkov reports/html reports/checkov/k8s.json "Checkov Kubernetes"
          python3 ci/generate-html-reports.py checkov reports/html reports/checkov/dockerfile-app.json "Checkov Dockerfile (app)"
          python3 ci/generate-html-reports.py checkov reports/html reports/checkov/dockerfile-frontend.json "Checkov Dockerfile (frontend)"
          cp -r reports/html/* reports/trivy/ 2>/dev/null || true
          cp reports/html/*.html reports/checkov/ 2>/dev/null || true

      - name: Upload container/IaC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-iac-reports
          path: |
            reports/trivy
            reports/checkov
            reports/html
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

  dast:
    name: dast
    needs: container_iac_scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe public API
        run: |
          set -euo pipefail
          curl -fsS "${{ env.PUBLIC_HEALTH_URL }}" >/dev/null
          echo "ZAP target=${{ env.PUBLIC_ZAP_TARGET }}"

      - name: OWASP ZAP baseline (K8s NodePort)
        run: |
          set -euo pipefail
          mkdir -p reports/dast
          chmod 777 reports/dast
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/reports/dast:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "${{ env.PUBLIC_ZAP_TARGET }}" \
            -r zap-report.html \
            -J zap-report.json \
            -I || true
          ls -lah reports/dast || true
          if [ ! -f reports/dast/zap-report.html ]; then
            echo "<html><body><h1>ZAP report missing</h1><p>Baseline did not write zap-report.html. Check job logs.</p></body></html>" \
              > reports/dast/zap-report.html
          fi

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-reports
          path: reports/dast
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

  performance:
    name: performance
    needs: dast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe public API
        run: |
          set -euo pipefail
          curl -fsS "${{ env.PUBLIC_HEALTH_URL }}" >/dev/null

      - name: Install k6
        run: |
          curl -fsSL -o /tmp/k6.tgz https://github.com/grafana/k6/releases/download/v0.49.0/k6-v0.49.0-linux-amd64.tar.gz
          sudo tar -C /tmp -xzf /tmp/k6.tgz
          sudo install -m 0755 /tmp/k6-v0.49.0-linux-amd64/k6 /usr/local/bin/k6

      - name: k6 load + stress test (K8s NodePort)
        run: |
          mkdir -p reports/perf/k6
          k6 run --out json=reports/perf/k6/raw-smoke.json \
            -e BASE_URL="${{ env.PUBLIC_APP_BASE }}" \
            tests/k6/smoke.js || true
          k6 run --out json=reports/perf/k6/raw.json \
            -e BASE_URL="${{ env.PUBLIC_APP_BASE }}" \
            tests/k6/stress.js || true

      - name: Install JMeter
        run: |
          JMETER_VER=5.6.3
          curl -fsSL -o /tmp/jmeter.tgz "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VER}.tgz"
          sudo tar -C /opt -xzf /tmp/jmeter.tgz
          echo "/opt/apache-jmeter-${JMETER_VER}/bin" >> "$GITHUB_PATH"

      - name: Run JMeter (K8s NodePort 30081)
        run: |
          mkdir -p reports/perf/jmeter tests/jmeter/output reports/perf/jmeter-dashboard
          cp tests/jmeter/warehouse-load.jmx /tmp/warehouse-load.ci.jmx
          sed -i 's#<stringProp name="HTTPSampler.domain">[^<]*</stringProp>#<stringProp name="HTTPSampler.domain">121.40.253.17</stringProp>#g' /tmp/warehouse-load.ci.jmx
          sed -i 's#<stringProp name="HTTPSampler.port">[^<]*</stringProp>#<stringProp name="HTTPSampler.port">30081</stringProp>#g' /tmp/warehouse-load.ci.jmx
          jmeter -n -t /tmp/warehouse-load.ci.jmx \
            -l reports/perf/jmeter/result.jtl \
            -j reports/perf/jmeter/jmeter.log \
            -e -o reports/perf/jmeter-dashboard || true

      - name: Build k6 / JMeter HTML summaries
        if: always()
        run: |
          python3 ci/generate-html-reports.py k6 reports/perf/k6 reports/perf/k6/raw.json
          python3 ci/generate-html-reports.py jmeter reports/perf/jmeter reports/perf/jmeter/result.jtl
          {
            echo "performance_job=performance"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "time_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "baseUrl=${{ env.PUBLIC_APP_BASE }}"
            echo "k6_scripts=smoke.js,stress.js"
            echo "jmeter=warehouse-load.jmx"
          } > reports/perf/performance-execution-meta.txt

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: reports/perf
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

  html_dashboard:
    name: html_dashboard
    needs: [sast, unit, integration, e2e, container_iac_scan, dast, performance, sonar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all report artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: collected

      - name: Assemble dashboard
        run: |
          set -euo pipefail
          mkdir -p dashboard collected
          if [ ! -d collected ] || [ -z "$(ls -A collected 2>/dev/null || true)" ]; then
            echo "No report artifacts downloaded; generating empty dashboard shell"
            echo '<html><body><h1>CI Dashboard</h1><p>No stage reports available yet.</p></body></html>' > dashboard/index.html
            ls -lah dashboard
            exit 0
          fi
          find collected -type f \( -name '*.html' -o -name '*.htm' \) 2>/dev/null | while read -r f; do
            base="$(basename "$f")"
            rel="$(echo "$f" | sed 's#^collected/##' | tr '/' '_')"
            cp "$f" "dashboard/${rel}"
          done
          cp collected/sast-reports/sast-summary.html dashboard/sast-summary.html 2>/dev/null || true
          cp collected/sast-reports/reports/sast/sast-summary.html dashboard/sast-summary.html 2>/dev/null || true
          cp collected/unit-reports/unit-summary.html dashboard/unit-summary.html 2>/dev/null || true
          cp collected/unit-reports/reports/unit/unit-summary.html dashboard/unit-summary.html 2>/dev/null || true
          find collected/unit-reports -type f -name 'unit-summary.html' -exec cp {} dashboard/unit-summary.html \; 2>/dev/null || true
          if [ -d collected/unit-reports/target/site/jacoco ]; then
            cp -r collected/unit-reports/target/site/jacoco dashboard/jacoco
          elif [ -d collected/unit-reports/reports/unit/jacoco ]; then
            cp -r collected/unit-reports/reports/unit/jacoco dashboard/jacoco
          elif [ -d collected/unit-reports/jacoco ]; then
            cp -r collected/unit-reports/jacoco dashboard/jacoco
          elif [ -d collected/unit-reports/unit/jacoco ]; then
            cp -r collected/unit-reports/unit/jacoco dashboard/jacoco
          fi
          cp collected/integration-reports/newman.html dashboard/newman.html 2>/dev/null || true
          cp collected/dast-zap-reports/zap-report.html dashboard/zap-report.html 2>/dev/null || true
          cp collected/dast-zap-reports/reports/dast/zap-report.html dashboard/zap-report.html 2>/dev/null || true
          find collected -type f \( -iname 'zap-report.html' -o -iname 'zap*.html' \) -exec cp {} dashboard/zap-report.html \; 2>/dev/null || true
          if [ ! -f dashboard/zap-report.html ]; then
            echo '<html><body><h1>ZAP report not found in artifacts</h1></body></html>' > dashboard/zap-report.html
          fi
          if [ ! -f dashboard/unit-summary.html ]; then
            echo '<html><body><h1>Unit summary not found in artifacts</h1></body></html>' > dashboard/unit-summary.html
          fi
          cp collected/sonar-reports/sonar-summary.html dashboard/sonar-summary.html 2>/dev/null || true
          cp collected/performance-reports/k6/k6-summary.html dashboard/k6-summary.html 2>/dev/null || true
          cp collected/performance-reports/jmeter/jmeter-summary.html dashboard/jmeter-summary.html 2>/dev/null || true
          cp collected/e2e-reports/e2e-summary.html dashboard/e2e-summary.html 2>/dev/null || true
          cp collected/e2e-reports/e2e-results.json dashboard/e2e-results.json 2>/dev/null || true
          cp collected/e2e-reports/e2e-run.log dashboard/e2e-run.log 2>/dev/null || true
          find collected/e2e-reports -type f -name 'e2e-summary.html' -exec cp {} dashboard/e2e-summary.html \; 2>/dev/null || true
          if [ -d collected/performance-reports/jmeter-dashboard ]; then
            cp -r collected/performance-reports/jmeter-dashboard dashboard/jmeter-dashboard
          fi
          for f in collected/container-iac-reports/html/*.html collected/container-iac-reports/trivy/*.html collected/container-iac-reports/checkov/*.html; do
            [ -f "$f" ] || continue
            cp "$f" "dashboard/$(basename "$f")"
          done

          [ -f dashboard/unit-summary.html ] || cp dashboard/unit-reports_reports_unit_unit-summary.html dashboard/unit-summary.html 2>/dev/null || true
          [ -f dashboard/sast-summary.html ] || cp dashboard/sast-reports_sast-summary.html dashboard/sast-summary.html 2>/dev/null || true
          [ -f dashboard/zap-report.html ] || cp dashboard/dast-zap-reports_zap-report.html dashboard/zap-report.html 2>/dev/null || true
          [ -f dashboard/e2e-summary.html ] || cp dashboard/e2e-reports_e2e-summary.html dashboard/e2e-summary.html 2>/dev/null || true

          python3 ci/generate-html-reports.py index dashboard \
            "Evidence|五类测试证据总览|evidence-index.html|Unit/Integration/E2E/Perf/Security 可核查入口" \
            "Unit|Unit Test Summary|unit-summary.html|Maven Surefire 完整用例结果" \
            "Unit|JaCoCo Coverage Report|jacoco/index.html|语句/分支覆盖率" \
            "Integration|Newman API Report|newman.html|跨模块接口集成" \
            "E2E|User Journey E2E|e2e-summary.html|真实用户流程 PASS/FAIL" \
            "SAST|SAST Security Scan Summary|sast-summary.html|Gitleaks + Semgrep" \
            "Container|Trivy App Image|app-image.html|镜像漏洞分级" \
            "Container|Trivy Frontend Image|frontend-image.html|前端镜像扫描" \
            "Container|Trivy Filesystem|fs.html|依赖/配置扫描" \
            "IaC|Checkov Kubernetes|k8s.html|K8s 配置检查" \
            "DAST|OWASP ZAP Report|zap-report.html|动态扫描 HTML" \
            "Security|Security Evidence Pack|security-evidence.html|漏洞清单与复测核查" \
            "Performance|K6 Summary|k6-summary.html|延迟 p50/p95/压力阶梯" \
            "Performance|JMeter Summary|jmeter-summary.html|JTL 汇总" \
            "Performance|JMeter Dashboard|jmeter-dashboard/index.html|吞吐/响应时间曲线" \
            "Performance|Bottleneck Analysis|perf-analysis.html|瓶颈与优化方案" \
            "Sonar|SonarQube Measures|sonar-summary.html|Bugs/Vulns/Hotspots/Coverage" \
            "Sonar|SonarQube Dashboard|${{ secrets.SONAR_HOST_URL }}/dashboard?id=warehouse-management|服务器 Sonar"

          python3 ci/generate-evidence-pack.py dashboard

          echo "## CI HTML Dashboard" >> "$GITHUB_STEP_SUMMARY"
          echo "Download artifact **ci-html-dashboard** and open \`index.html\` in a browser." >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ vars.SONAR_ENABLED }}" = "true" ]; then
            echo "SonarQube: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=warehouse-management" >> "$GITHUB_STEP_SUMMARY"
          fi
          ls -lah dashboard > "$RUNNER_TEMP/dashboard-ls.txt" || true
          head -n 50 "$RUNNER_TEMP/dashboard-ls.txt" || true
          echo "dashboard_files=$(find dashboard -type f | wc -l)"

      - name: Upload HTML dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-html-dashboard
          path: dashboard
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

  publish_reports:
    name: publish_reports
    needs: html_dashboard
    if: ${{ always() && vars.REPORTS_SYNC_ENABLED == 'true' && needs.html_dashboard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download dashboard
        uses: actions/download-artifact@v4
        with:
          name: ci-html-dashboard
          path: dashboard

      - name: Sync reports to server nginx volume
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          source: "dashboard"
          target: "${{ vars.REPORTS_REMOTE_DIR || '/opt/ci-reports' }}/${{ github.run_number }}"
          overwrite: true

      - name: Point latest + refresh index
        uses: appleboy/ssh-action@v1.2.1
        env:
          RUN_ID: ${{ github.run_number }}
          REPORTS_REMOTE_DIR: ${{ vars.REPORTS_REMOTE_DIR || '/opt/ci-reports' }}
          REPORTS_HTTP_PORT: ${{ vars.REPORTS_HTTP_PORT || '9080' }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          envs: RUN_ID,REPORTS_REMOTE_DIR,REPORTS_HTTP_PORT
          script: |
            set -euo pipefail
            RD="${REPORTS_REMOTE_DIR:-/opt/ci-reports}"
            mkdir -p "${RD}"
            if [ -d "${RD}/${RUN_ID}/dashboard" ] && [ ! -f "${RD}/${RUN_ID}/index.html" ]; then
              shopt -s dotglob
              mv "${RD}/${RUN_ID}/dashboard"/* "${RD}/${RUN_ID}/" 2>/dev/null || true
              rmdir "${RD}/${RUN_ID}/dashboard" 2>/dev/null || true
            fi
            rm -rf "${RD}/latest"
            ln -sfn "${RUN_ID}" "${RD}/latest"
            test -L "${RD}/latest"
            test -f "${RD}/latest/index.html"
            cat > "${RD}/index.html" <<EOF
            <html><body>
            <h1>CI Reports</h1>
            <p>Run ${RUN_ID}</p>
            <ul>
              <li><a href="./latest/evidence-index.html">????????????</a></li>
              <li><a href="./latest/index.html">Dashboard (latest)</a></li>
              <li><a href="./latest/unit-summary.html">Unit Summary</a></li>
              <li><a href="./latest/jacoco/index.html">JaCoCo Coverage</a></li>
              <li><a href="./latest/newman.html">Integration Newman</a></li>
              <li><a href="./latest/e2e-summary.html">E2E User Journey</a></li>
              <li><a href="./latest/k6-summary.html">k6 Perf</a></li>
              <li><a href="./latest/jmeter-dashboard/index.html">JMeter Charts</a></li>
              <li><a href="./latest/perf-analysis.html">Perf Bottleneck Analysis</a></li>
              <li><a href="./latest/sast-summary.html">SAST</a></li>
              <li><a href="./latest/security-evidence.html">Security Evidence</a></li>
              <li><a href="./latest/app-image.html">Trivy App Image</a></li>
              <li><a href="./latest/zap-report.html">ZAP DAST</a></li>
              <li><a href="./latest/sonar-summary.html">Sonar Measures</a></li>
            </ul>
            </body></html>
            EOF
            sed -i 's/^            //' "${RD}/index.html"
            echo "URL: http://<host>:${REPORTS_HTTP_PORT}/reports/latest/index.html"
            find "${RD}/latest" -maxdepth 2 -type f -name '*.html' > /tmp/ci-reports-html-list.txt || true
            head -n 30 /tmp/ci-reports-html-list.txt || true

  deploy_gate:
    name: deploy_gate
    needs: [sast, unit, sonar, integration, e2e, container_iac_scan, dast, performance, html_dashboard, publish_reports]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (github.ref_name == 'master' || github.ref_name == 'main'))) &&
      needs.sast.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.container_iac_scan.result == 'success' &&
      needs.dast.result == 'success' &&
      needs.performance.result == 'success' &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') &&
      needs.html_dashboard.result == 'success' &&
      (needs.publish_reports.result == 'success' || needs.publish_reports.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Ready for CD
        run: echo "CD gate passed event=${{ github.event_name }} sha=${{ github.sha }}"

  sync:
    name: sync
    needs: deploy_gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SSH key secret
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ "${#SSH_PRIVATE_KEY}" -lt 80 ]; then
            echo "::error::Set secret ALIYUN_SSH_KEY"
            exit 1
          fi
          printf '%s\n' "$SSH_PRIVATE_KEY" | grep -qE 'BEGIN (OPENSSH|RSA|EC) PRIVATE KEY' \
            || { echo "::error::ALIYUN_SSH_KEY must be a PRIVATE key PEM."; exit 1; }

      - name: Pack source
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/warehouse-src.tgz"
          set +e
          tar --exclude='./.git' --exclude='**/node_modules' --exclude='./target' \
              --exclude='./warehouse-src.tgz' \
              -czf "$OUT" .
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error::tar failed with exit $rc"
            exit "$rc"
          fi
          if [ "$rc" -eq 1 ]; then
            echo "::warning::tar reported files changed during read (exit 1); continuing if archive is valid"
          fi
          test -s "$OUT"
          cp -f "$OUT" warehouse-src.tgz
          chmod 644 warehouse-src.tgz
          ls -lh warehouse-src.tgz
          test -s warehouse-src.tgz

      # appleboy/scp-action auth works (same as Prepare). Avoid native openssh scp
      # which failed with Permission denied (publickey) against the same secrets.
      # Upload into a fresh per-run dir so nested untar does not hit a root-owned
      # /tmp/warehouse-src.tgz (previous Permission denied on tar open).
      - name: Prepare remote upload dir
        uses: appleboy/ssh-action@v1.2.1
        env:
          RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          envs: RUN_ID
          script: |
            set -euo pipefail
            UPLOAD_DIR="/tmp/warehouse-upload-${RUN_ID}"
            rm -rf "$UPLOAD_DIR" 2>/dev/null || true
            mkdir -p "$UPLOAD_DIR"
            chmod 755 "$UPLOAD_DIR"
            rm -f /tmp/warehouse-src.tgz 2>/dev/null || true
            sudo rm -f /tmp/warehouse-src.tgz 2>/dev/null || true
            ls -ld "$UPLOAD_DIR"

      - name: Upload tarball
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          source: "warehouse-src.tgz"
          target: "/tmp/warehouse-upload-${{ github.run_id }}/"
          overwrite: true

      - name: Extract on host
        uses: appleboy/ssh-action@v1.2.1
        env:
          DEPLOY_PATH: ${{ vars.ALIYUN_DEPLOY_PATH }}
          RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          command_timeout: 10m
          envs: DEPLOY_PATH,RUN_ID
          script: |
            set -euo pipefail
            DP="${DEPLOY_PATH:-/opt/deploy/warehouse-management-project}"
            TGZ="/tmp/warehouse-upload-${RUN_ID}/warehouse-src.tgz"
            test -s "$TGZ"
            mkdir -p "$DP"
            tar -xzf "$TGZ" -C "$DP"
            sed -i 's/\r$//' "$DP"/k8s/*.sh || true
            chmod +x "$DP"/k8s/*.sh
            test -f "$DP/Dockerfile" && test -f "$DP/k8s/apply-stack.sh"
            rm -rf "/tmp/warehouse-upload-${RUN_ID}" || true
            echo "== sync ok path=${DP}"

  build:
    name: build
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Build images tagged for Harbor
        uses: appleboy/ssh-action@v1.2.1
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          DEPLOY_PATH: ${{ vars.ALIYUN_DEPLOY_PATH }}
          HARBOR_HOST: ${{ vars.HARBOR_HOST }}
          HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          command_timeout: 60m
          envs: GITHUB_RUN_NUMBER,GITHUB_SHA,DEPLOY_PATH,HARBOR_HOST,HARBOR_PROJECT
          script: |
            set -euo pipefail
            DP="${DEPLOY_PATH:-/opt/deploy/warehouse-management-project}"
            HH="${HARBOR_HOST:-121.40.253.17}"
            HP="${HARBOR_PROJECT:-warehouse}"
            SHORT="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
            TAG="build.${GITHUB_RUN_NUMBER}-${SHORT}"
            IMAGE="${HH}/${HP}/warehouse-app:${TAG}"
            FE_IMAGE="${HH}/${HP}/warehouse-frontend:${TAG}"
            cd "$DP"
            docker build -t "${IMAGE}" -t "${HH}/${HP}/warehouse-app:latest" -f ./Dockerfile .
            docker build -t "${FE_IMAGE}" -t "${HH}/${HP}/warehouse-frontend:latest" -f Dockerfile.frontend .
            echo "${IMAGE}" > /tmp/warehouse-app.image
            echo "${FE_IMAGE}" > /tmp/warehouse-frontend.image
            echo "${TAG}" > /tmp/warehouse-image.tag
            printf '%s\n' "${TAG}" > /tmp/warehouse-image.tag.txt
            echo "== BUILD ok tag=${TAG}"
            echo "== app=${IMAGE}"
            echo "== fe=${FE_IMAGE}"

  push-harbor:
    name: push-harbor
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Push to Harbor
        uses: appleboy/ssh-action@v1.2.1
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          HARBOR_HOST: ${{ vars.HARBOR_HOST }}
          HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          command_timeout: 30m
          envs: GITHUB_RUN_NUMBER,HARBOR_HOST,HARBOR_PROJECT,HARBOR_USER,HARBOR_PASSWORD
          script: |
            set -euo pipefail
            HH="${HARBOR_HOST:-121.40.253.17}"
            HP="${HARBOR_PROJECT:-warehouse}"
            HU="${HARBOR_USER:-admin}"
            HPW="${HARBOR_PASSWORD:-Harbor12345}"
            IMAGE="$(cat /tmp/warehouse-app.image)"
            FE_IMAGE="$(cat /tmp/warehouse-frontend.image)"
            curl -fsS -u "${HU}:${HPW}" -H 'Content-Type: application/json' \
              -X POST "http://${HH}/api/v2.0/projects" \
              -d "{\"project_name\":\"${HP}\",\"public\":true,\"metadata\":{\"public\":\"true\"}}" \
              >/dev/null 2>&1 || true
            echo "${HPW}" | docker login "${HH}" -u "${HU}" --password-stdin
            docker push "${IMAGE}"
            docker push "${FE_IMAGE}"
            docker push "${HH}/${HP}/warehouse-app:latest" || true
            docker push "${HH}/${HP}/warehouse-frontend:latest" || true
            echo "== pushed ${IMAGE} ${FE_IMAGE}"

  prepare-k8s:
    name: prepare-k8s
    needs: push-harbor
    runs-on: ubuntu-latest
    steps:
      - name: Namespace + Harbor pull secret only
        uses: appleboy/ssh-action@v1.2.1
        env:
          DEPLOY_PATH: ${{ vars.ALIYUN_DEPLOY_PATH }}
          K8S_DIR: ${{ vars.K8S_DIR }}
          NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          HARBOR_HOST: ${{ vars.HARBOR_HOST }}
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          command_timeout: 10m
          envs: DEPLOY_PATH,K8S_DIR,NAMESPACE,HARBOR_HOST,HARBOR_USER,HARBOR_PASSWORD
          script: |
            set -euo pipefail
            DP="${DEPLOY_PATH:-/opt/deploy/warehouse-management-project}"
            KD="${K8S_DIR:-${DP}/k8s}"
            NS="${NAMESPACE:-warehouse}"
            HH="${HARBOR_HOST:-121.40.253.17}"
            HU="${HARBOR_USER:-admin}"
            HPW="${HARBOR_PASSWORD:-Harbor12345}"
            kubectl apply -f "${KD}/namespace.yaml"
            kubectl -n "${NS}" create secret docker-registry harbor-cred \
              --docker-server="${HH}" \
              --docker-username="${HU}" \
              --docker-password="${HPW}" \
              --dry-run=client -o yaml | kubectl apply -f -
            if kubectl -n "${NS}" get deploy mysql >/dev/null 2>&1; then
              echo "== mysql already present - leaving untouched"
            else
              echo "::warning::mysql deployment not found in ${NS}; app will need an existing DB endpoint"
            fi
            echo "== prepare-k8s ok"

  deploy-services:
    name: deploy-services
    needs: prepare-k8s
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Java + frontend with unique Harbor tag
        uses: appleboy/ssh-action@v1.2.1
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          DEPLOY_PATH: ${{ vars.ALIYUN_DEPLOY_PATH }}
          K8S_DIR: ${{ vars.K8S_DIR }}
          NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          HARBOR_HOST: ${{ vars.HARBOR_HOST }}
          HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST || '121.40.253.17' }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          command_timeout: 30m
          envs: GITHUB_RUN_NUMBER,DEPLOY_PATH,K8S_DIR,NAMESPACE,HARBOR_HOST,HARBOR_PROJECT,PUBLIC_HOST
          script: |
            set -euo pipefail
            DP="${DEPLOY_PATH:-/opt/deploy/warehouse-management-project}"
            KD="${K8S_DIR:-${DP}/k8s}"
            NS="${NAMESPACE:-warehouse}"
            IMAGE="$(cat /tmp/warehouse-app.image)"
            FE_IMAGE="$(cat /tmp/warehouse-frontend.image)"
            TAG="$(cat /tmp/warehouse-image.tag)"
            tmp_app="$(mktemp)"
            tmp_fe="$(mktemp)"
            sed -E "s|image:[[:space:]]*[^[:space:]]*warehouse-app:[^[:space:]]*|image: ${IMAGE}|" \
              "${KD}/app.yaml" >"${tmp_app}"
            sed -E "s|image:[[:space:]]*[^[:space:]]*warehouse-frontend:[^[:space:]]*|image: ${FE_IMAGE}|" \
              "${KD}/frontend.yaml" >"${tmp_fe}"
            kubectl apply -f "${tmp_app}"
            kubectl apply -f "${tmp_fe}"
            rm -f "${tmp_app}" "${tmp_fe}"
            kubectl -n "${NS}" patch deployment warehouse-app --type strategic -p \
              '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"harbor-cred"}]}}}}'
            kubectl -n "${NS}" patch deployment warehouse-frontend --type strategic -p \
              '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"harbor-cred"}]}}}}'
            kubectl set image "deployment/warehouse-app" "app=${IMAGE}" -n "${NS}"
            kubectl set image "deployment/warehouse-frontend" "frontend=${FE_IMAGE}" -n "${NS}"
            kubectl -n "${NS}" annotate deployment warehouse-app warehouse-frontend \
              "warehouse.io/image-tag=${TAG}" \
              "kubectl.kubernetes.io/restartedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" --overwrite
            kubectl rollout status "deployment/warehouse-app" -n "${NS}" --timeout=600s
            kubectl rollout status "deployment/warehouse-frontend" -n "${NS}" --timeout=600s
            APP_LIVE="$(kubectl -n "${NS}" get deploy warehouse-app -o jsonpath='{.spec.template.spec.containers[0].image}')"
            FE_LIVE="$(kubectl -n "${NS}" get deploy warehouse-frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"
            [ "${APP_LIVE}" = "${IMAGE}" ] || { echo "::error::app image mismatch"; exit 1; }
            [ "${FE_LIVE}" = "${FE_IMAGE}" ] || { echo "::error::frontend image mismatch"; exit 1; }
            PUB="${PUBLIC_HOST:-121.40.253.17}"
            curl -fsS "http://${PUB}:30081/springboot38hdw40x/config/list?page=1&limit=1" >/dev/null && echo API_OK
            curl -fsS -o /dev/null "http://${PUB}:30080/" && echo FE_OK

  deploy-gateway:
    name: deploy-gateway
    needs: deploy-services
    runs-on: ubuntu-latest
    steps:
      - name: Ingress optional
        uses: appleboy/ssh-action@v1.2.1
        env:
          DEPLOY_PATH: ${{ vars.ALIYUN_DEPLOY_PATH }}
          K8S_DIR: ${{ vars.K8S_DIR }}
          NAMESPACE: ${{ vars.K8S_NAMESPACE }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          command_timeout: 10m
          envs: DEPLOY_PATH,K8S_DIR,NAMESPACE
          script: |
            set -euo pipefail
            DP="${DEPLOY_PATH:-/opt/deploy/warehouse-management-project}"
            KD="${K8S_DIR:-${DP}/k8s}"
            [ -f "${KD}/ingress.yaml" ] && kubectl apply -f "${KD}/ingress.yaml" || true
            echo "== FE:30080 API:30081 Harbor:80"

  verify:
    name: verify
    needs: deploy-gateway
    runs-on: ubuntu-latest
    steps:
      - name: Verify
        uses: appleboy/ssh-action@v1.2.1
        env:
          NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST || '121.40.253.17' }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          command_timeout: 10m
          envs: NAMESPACE,GITHUB_RUN_NUMBER,PUBLIC_HOST
          script: |
            set -euo pipefail
            NS="${NAMESPACE:-warehouse}"
            TAG="$(cat /tmp/warehouse-image.tag 2>/dev/null || echo "build.${GITHUB_RUN_NUMBER}")"
            kubectl get pods,svc,deploy -n "${NS}" -o wide
            echo "== expected tag=${TAG}"
            kubectl get deploy -n "${NS}" -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.template.spec.containers[0].image}{"\n"}{end}'
            PUB="${PUBLIC_HOST:-121.40.253.17}"
            curl -fsS "http://${PUB}:30081/springboot38hdw40x/config/list?page=1&limit=1" && echo
            curl -fsS -o /dev/null "http://${PUB}:30080/" && echo FE_OK

      - name: Summary
        run: |
          {
            echo "## Deploy Aliyun"
            echo "- Unique Harbor tag format: \`build.<run>-<sha7>\`"
            echo "- Frontend: http://121.40.253.17:30080/"
            echo "- API: http://121.40.253.17:30081/springboot38hdw40x/"
            echo "- MySQL: left as-is"
            echo "- Deploy run: \`${{ github.run_number }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
