name: Deploy Aliyun

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Cicd]
    types: [completed]
    branches: [master, main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-aliyun-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'master' ||
        github.event.workflow_run.head_branch == 'main'))
    steps:
      - name: Ready for CD
        run: echo "CD gate passed event=${{ github.event_name }} sha=${{ github.sha }}"

  sync:
    name: sync
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check SSH key secret
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ "${#SSH_PRIVATE_KEY}" -lt 80 ]; then
            echo "::error::Set secret ALIYUN_SSH_KEY"
            exit 1
          fi
          printf '%s\n' "$SSH_PRIVATE_KEY" | grep -qE 'BEGIN (OPENSSH|RSA|EC) PRIVATE KEY' \
            || { echo "::error::ALIYUN_SSH_KEY must be a PRIVATE key PEM."; exit 1; }

      - name: Pack source
        run: |
          set -euo pipefail
          # 1) Archive to RUNNER_TEMP (not into ".").
          # 2) GNU tar exits 1 on "file changed as we read it" - treat as OK if archive is non-empty.
          # 3) Copy into GITHUB_WORKSPACE for appleboy/scp-action (Docker only mounts workspace).
          OUT="${RUNNER_TEMP}/warehouse-src.tgz"
          set +e
          tar --exclude='./.git' --exclude='**/node_modules' --exclude='./target' \
              --exclude='./warehouse-src.tgz' \
              -czf "$OUT" .
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error::tar failed with exit $rc"
            exit "$rc"
          fi
          if [ "$rc" -eq 1 ]; then
            echo "::warning::tar reported files changed during read (exit 1); continuing if archive is valid"
          fi
          test -s "$OUT"
          cp -f "$OUT" warehouse-src.tgz
          chmod 644 warehouse-src.tgz
          ls -lh warehouse-src.tgz
          test -s warehouse-src.tgz

      - name: Upload tarball
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          source: "warehouse-src.tgz"
          target: "/tmp/"
          overwrite: true

      - name: Extract on host
        uses: appleboy/ssh-action@v1.2.1
        env:
          DEPLOY_PATH: ${{ vars.ALIYUN_DEPLOY_PATH }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          command_timeout: 10m
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            DP="${DEPLOY_PATH:-/opt/deploy/warehouse-management-project}"
            mkdir -p "$DP"
            tar -xzf /tmp/warehouse-src.tgz -C "$DP"
            sed -i 's/\r$//' "$DP"/k8s/*.sh || true
            chmod +x "$DP"/k8s/*.sh
            test -f "$DP/Dockerfile" && test -f "$DP/k8s/apply-stack.sh"
            echo "== sync ok path=${DP}"

  build:
    name: build
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Build images tagged for Harbor
        uses: appleboy/ssh-action@v1.2.1
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_PATH: ${{ vars.ALIYUN_DEPLOY_PATH }}
          HARBOR_HOST: ${{ vars.HARBOR_HOST }}
          HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          command_timeout: 60m
          envs: GITHUB_RUN_NUMBER,GITHUB_SHA,DEPLOY_PATH,HARBOR_HOST,HARBOR_PROJECT
          script: |
            set -euo pipefail
            DP="${DEPLOY_PATH:-/opt/deploy/warehouse-management-project}"
            HH="${HARBOR_HOST:-121.40.253.17}"
            HP="${HARBOR_PROJECT:-warehouse}"
            SHORT="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
            # Unique per CD run: build.<deploy-run>-<sha7> (immutable Harbor tag)
            TAG="build.${GITHUB_RUN_NUMBER}-${SHORT}"
            IMAGE="${HH}/${HP}/warehouse-app:${TAG}"
            FE_IMAGE="${HH}/${HP}/warehouse-frontend:${TAG}"
            cd "$DP"
            docker build -t "${IMAGE}" -t "${HH}/${HP}/warehouse-app:latest" -f ./Dockerfile .
            docker build -t "${FE_IMAGE}" -t "${HH}/${HP}/warehouse-frontend:latest" -f Dockerfile.frontend .
            echo "${IMAGE}" > /tmp/warehouse-app.image
            echo "${FE_IMAGE}" > /tmp/warehouse-frontend.image
            echo "${TAG}" > /tmp/warehouse-image.tag
            printf '%s\n' "${TAG}" > /tmp/warehouse-image.tag.txt
            echo "== BUILD ok tag=${TAG}"
            echo "== app=${IMAGE}"
            echo "== fe=${FE_IMAGE}"

  push-harbor:
    name: push-harbor
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Push to Harbor
        uses: appleboy/ssh-action@v1.2.1
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          HARBOR_HOST: ${{ vars.HARBOR_HOST }}
          HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          command_timeout: 30m
          envs: GITHUB_RUN_NUMBER,HARBOR_HOST,HARBOR_PROJECT,HARBOR_USER,HARBOR_PASSWORD
          script: |
            set -euo pipefail
            HH="${HARBOR_HOST:-121.40.253.17}"
            HP="${HARBOR_PROJECT:-warehouse}"
            HU="${HARBOR_USER:-admin}"
            HPW="${HARBOR_PASSWORD:-Harbor12345}"
            IMAGE="$(cat /tmp/warehouse-app.image)"
            FE_IMAGE="$(cat /tmp/warehouse-frontend.image)"
            curl -fsS -u "${HU}:${HPW}" -H 'Content-Type: application/json' \
              -X POST "http://${HH}/api/v2.0/projects" \
              -d "{\"project_name\":\"${HP}\",\"public\":true,\"metadata\":{\"public\":\"true\"}}" \
              >/dev/null 2>&1 || true
            echo "${HPW}" | docker login "${HH}" -u "${HU}" --password-stdin
            docker push "${IMAGE}"
            docker push "${FE_IMAGE}"
            docker push "${HH}/${HP}/warehouse-app:latest" || true
            docker push "${HH}/${HP}/warehouse-frontend:latest" || true
            echo "== pushed ${IMAGE} ${FE_IMAGE}"

  prepare-k8s:
    name: prepare-k8s
    needs: push-harbor
    runs-on: ubuntu-latest
    steps:
      - name: Namespace + Harbor pull secret only (skip MySQL)
        uses: appleboy/ssh-action@v1.2.1
        env:
          DEPLOY_PATH: ${{ vars.ALIYUN_DEPLOY_PATH }}
          K8S_DIR: ${{ vars.K8S_DIR }}
          NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          HARBOR_HOST: ${{ vars.HARBOR_HOST }}
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          command_timeout: 10m
          envs: DEPLOY_PATH,K8S_DIR,NAMESPACE,HARBOR_HOST,HARBOR_USER,HARBOR_PASSWORD
          script: |
            set -euo pipefail
            DP="${DEPLOY_PATH:-/opt/deploy/warehouse-management-project}"
            KD="${K8S_DIR:-${DP}/k8s}"
            NS="${NAMESPACE:-warehouse}"
            HH="${HARBOR_HOST:-121.40.253.17}"
            HU="${HARBOR_USER:-admin}"
            HPW="${HARBOR_PASSWORD:-Harbor12345}"
            kubectl apply -f "${KD}/namespace.yaml"
            kubectl -n "${NS}" create secret docker-registry harbor-cred \
              --docker-server="${HH}" \
              --docker-username="${HU}" \
              --docker-password="${HPW}" \
              --dry-run=client -o yaml | kubectl apply -f -
            if kubectl -n "${NS}" get deploy mysql >/dev/null 2>&1; then
              echo "== mysql already present - leaving untouched"
              kubectl -n "${NS}" get deploy,pods -l app=mysql -o wide || true
            else
              echo "::warning::mysql deployment not found in ${NS}; app will need an existing DB endpoint"
            fi
            echo "== prepare-k8s ok (MySQL skipped)"

  deploy-services:
    name: deploy-services
    needs: prepare-k8s
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Java + frontend with unique Harbor tag
        uses: appleboy/ssh-action@v1.2.1
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          DEPLOY_PATH: ${{ vars.ALIYUN_DEPLOY_PATH }}
          K8S_DIR: ${{ vars.K8S_DIR }}
          NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          HARBOR_HOST: ${{ vars.HARBOR_HOST }}
          HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST || '121.40.253.17' }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          command_timeout: 30m
          envs: GITHUB_RUN_NUMBER,DEPLOY_PATH,K8S_DIR,NAMESPACE,HARBOR_HOST,HARBOR_PROJECT,PUBLIC_HOST
          script: |
            set -euo pipefail
            DP="${DEPLOY_PATH:-/opt/deploy/warehouse-management-project}"
            KD="${K8S_DIR:-${DP}/k8s}"
            NS="${NAMESPACE:-warehouse}"
            IMAGE="$(cat /tmp/warehouse-app.image)"
            FE_IMAGE="$(cat /tmp/warehouse-frontend.image)"
            TAG="$(cat /tmp/warehouse-image.tag)"
            echo "== deploy unique tag=${TAG}"
            echo "== app=${IMAGE}"
            echo "== fe=${FE_IMAGE}"

            # Apply manifests with THIS run's immutable tag (never leave cluster on :latest)
            tmp_app="$(mktemp)"
            tmp_fe="$(mktemp)"
            sed -E "s|image:[[:space:]]*[^[:space:]]*warehouse-app:[^[:space:]]*|image: ${IMAGE}|" \
              "${KD}/app.yaml" >"${tmp_app}"
            sed -E "s|image:[[:space:]]*[^[:space:]]*warehouse-frontend:[^[:space:]]*|image: ${FE_IMAGE}|" \
              "${KD}/frontend.yaml" >"${tmp_fe}"
            grep -E 'image:' "${tmp_app}" "${tmp_fe}"
            kubectl apply -f "${tmp_app}"
            kubectl apply -f "${tmp_fe}"
            rm -f "${tmp_app}" "${tmp_fe}"

            kubectl -n "${NS}" patch deployment warehouse-app --type strategic -p \
              '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"harbor-cred"}]}}}}'
            kubectl -n "${NS}" patch deployment warehouse-frontend --type strategic -p \
              '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"harbor-cred"}]}}}}'
            # Belt-and-suspenders: force Deployment image to unique Harbor refs
            kubectl set image "deployment/warehouse-app" "app=${IMAGE}" -n "${NS}"
            kubectl set image "deployment/warehouse-frontend" "frontend=${FE_IMAGE}" -n "${NS}"
            kubectl -n "${NS}" patch deployment warehouse-app -p \
              '{"spec":{"template":{"spec":{"containers":[{"name":"app","imagePullPolicy":"Always"}]}}}}'
            kubectl -n "${NS}" patch deployment warehouse-frontend -p \
              '{"spec":{"template":{"spec":{"containers":[{"name":"frontend","imagePullPolicy":"Always"}]}}}}'
            kubectl -n "${NS}" annotate deployment warehouse-app warehouse-frontend \
              "warehouse.io/image-tag=${TAG}" \
              "kubectl.kubernetes.io/restartedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" --overwrite

            kubectl rollout status "deployment/warehouse-app" -n "${NS}" --timeout=600s
            kubectl rollout status "deployment/warehouse-frontend" -n "${NS}" --timeout=600s

            APP_LIVE="$(kubectl -n "${NS}" get deploy warehouse-app -o jsonpath='{.spec.template.spec.containers[0].image}')"
            FE_LIVE="$(kubectl -n "${NS}" get deploy warehouse-frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"
            echo "== live app=${APP_LIVE}"
            echo "== live fe=${FE_LIVE}"
            [ "${APP_LIVE}" = "${IMAGE}" ] || { echo "::error::app image mismatch"; exit 1; }
            [ "${FE_LIVE}" = "${FE_IMAGE}" ] || { echo "::error::frontend image mismatch"; exit 1; }

            PUB="${PUBLIC_HOST:-121.40.253.17}"
            curl -fsS "http://${PUB}:30081/springboot38hdw40x/config/list?page=1&limit=1" >/dev/null && echo API_OK
            curl -fsS -o /dev/null "http://${PUB}:30080/" && echo FE_OK
            kubectl get pods -n "${NS}" -o wide
            kubectl get deploy -n "${NS}" -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.template.spec.containers[0].image}{"\n"}{end}'
            echo "== deployed tag=${TAG} (mysql untouched)"

  deploy-gateway:
    name: deploy-gateway
    needs: deploy-services
    runs-on: ubuntu-latest
    steps:
      - name: Ingress optional
        uses: appleboy/ssh-action@v1.2.1
        env:
          DEPLOY_PATH: ${{ vars.ALIYUN_DEPLOY_PATH }}
          K8S_DIR: ${{ vars.K8S_DIR }}
          NAMESPACE: ${{ vars.K8S_NAMESPACE }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          command_timeout: 10m
          envs: DEPLOY_PATH,K8S_DIR,NAMESPACE
          script: |
            set -euo pipefail
            DP="${DEPLOY_PATH:-/opt/deploy/warehouse-management-project}"
            KD="${K8S_DIR:-${DP}/k8s}"
            NS="${NAMESPACE:-warehouse}"
            [ -f "${KD}/ingress.yaml" ] && kubectl apply -f "${KD}/ingress.yaml" || true
            echo "== FE:30080 API:30081 Harbor:80"

  verify:
    name: verify
    needs: deploy-gateway
    runs-on: ubuntu-latest
    steps:
      - name: Verify
        uses: appleboy/ssh-action@v1.2.1
        env:
          NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST || '121.40.253.17' }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_KEY_PASSPHRASE }}
          port: ${{ vars.ALIYUN_SSH_PORT || 22 }}
          command_timeout: 10m
          envs: NAMESPACE,GITHUB_RUN_NUMBER,PUBLIC_HOST
          script: |
            set -euo pipefail
            NS="${NAMESPACE:-warehouse}"
            TAG="$(cat /tmp/warehouse-image.tag 2>/dev/null || echo "build.${GITHUB_RUN_NUMBER}")"
            IMAGE="$(cat /tmp/warehouse-app.image 2>/dev/null || true)"
            FE_IMAGE="$(cat /tmp/warehouse-frontend.image 2>/dev/null || true)"
            kubectl get pods,svc,deploy -n "${NS}" -o wide
            echo "== expected tag=${TAG}"
            kubectl get deploy -n "${NS}" -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.template.spec.containers[0].image}{"\n"}{end}'
            PUB="${PUBLIC_HOST:-121.40.253.17}"
            curl -fsS "http://${PUB}:30081/springboot38hdw40x/config/list?page=1&limit=1" && echo
            curl -fsS -o /dev/null "http://${PUB}:30080/" && echo FE_OK
            echo "tag=${TAG}"
            echo "app=${IMAGE}"
            echo "fe=${FE_IMAGE}"

      - name: Summary
        run: |
          {
            echo "## Deploy Aliyun"
            echo "- Unique Harbor tag format: \`build.<deploy-run>-<sha7>\` (immutable; also retags \`:latest\`)"
            echo "- K8s deployments updated to that tag via rendered manifests + \`kubectl set image\`"
            echo "- Frontend: http://121.40.253.17:30080/"
            echo "- API: http://121.40.253.17:30081/springboot38hdw40x/"
            echo "- MySQL: left as-is"
            echo "- Deploy run: \`${{ github.run_number }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
